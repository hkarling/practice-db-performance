spring:
  application:
    name: practice-db-performance
  docker:
    compose:
      lifecycle-management: start-only
      skip:
        in-tests: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace